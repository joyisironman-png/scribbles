plugins {
    id 'com.android.application'
}

android {
    namespace 'com.joy.scribbles'
    compileSdk 35

    defaultConfig {
        applicationId 'com.joy.scribbles'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '2.2'
    }

    signingConfigs {
        release {
            storeFile file('scribbles.jks')
            storePassword 'scribbles'
            keyAlias 'scribbles'
            keyPassword 'scribbles'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
